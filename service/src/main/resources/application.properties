org.marmotgraph.core.url=${KG_CORE_ENDPOINT}
org.marmotgraph.core.connection.maxRetries=${CORE_CONNECTION_MAX_RETRIES:30}
org.marmotgraph.core.connection.retryInterval=${CORE_CONNECTION_RETRY_INTERVAL:5}
org.marmotgraph.assetCache.refreshInterval=${ASSET_CACHE_REFRESH_INTERVAL:60}
# the time to live (in seconds) of the cached type definitions
org.marmotgraph.typeCache.ttl=${TYPE_CACHE_TTL:300}
# the time to live (in seconds) of the cached space definitions
org.marmotgraph.spaceCache.ttl=${SPACE_CACHE_TTL:300}
org.marmotgraph.tenant=${TENANT:default}


# Application internals (not meant for customization)
org.marmotgraph.api.root=/api
springdoc.api-docs.path=${org.marmotgraph.api.root}/docs
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
spring.jackson.default-property-inclusion=NON_ABSENT
# Enable response compression
server.compression.enabled=true
# Minimum response where compression will kick in
server.compression.min-response-size=4096
# Mime types that should be compressed
server.compression.mime-types=text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json

# Actuator config
management.endpoints.web.exposure.include=health,info,prometheus